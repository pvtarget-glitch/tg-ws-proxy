name: CF route tests

# Тесты маршрутизации через Cloudflare, обхода DPI и keepalive на настоящих
# Windows (proactor event loop) и Linux, включая Python 3.8 — на нём
# собирается сборка для Windows 7.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
      - 'tests/test_dpi.py'
      - 'tests/test_ws_keepalive.py'
      - 'tests/test_cf_routes.py'
      - '.github/workflows/cf-tests.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.8', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test deps
        run: python -m pip install --upgrade pip cryptography "httpx[http2]" pytest
      - name: Run CF tests
        run: python -m pytest -q tests/test_dpi.py tests/test_ws_keepalive.py tests/test_cf_routes.py
